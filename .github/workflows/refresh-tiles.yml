name: Refresh vector basemap tiles

# Rebuilds the default self-hosted basemap tiles (Telangana + Andhra Pradesh) from
# CURRENT OpenStreetMap data and re-uploads them to Cloudflare R2, so the hosted
# basemap stays fresh without a package release. Monthly, plus a manual trigger.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   R2_ACCESS_KEY_ID       — R2 API token access key id
#   R2_SECRET_ACCESS_KEY   — R2 API token secret
#   R2_ACCOUNT_ID          — Cloudflare account id (for the R2 S3 endpoint)

on:
  schedule:
    - cron: "0 3 1 * *" # 03:00 UTC on the 1st of every month
  workflow_dispatch: {}

concurrency:
  group: refresh-tiles
  cancel-in-progress: false

env:
  R2_BUCKET: beyond-basemap
  PMTILES: beyond-tgap.pmtiles

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Use the large ephemeral disk (/mnt) for the build
        run: |
          sudo mkdir -p /mnt/tiles
          sudo chown "$USER" /mnt/tiles

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install osmium + rclone
        run: sudo apt-get update && sudo apt-get install -y osmium-tool rclone

      - name: Build tiles
        run: bash scripts/build-tiles.sh /mnt/tiles

      - name: Upload to R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        # Set Cache-Control: no-store so Cloudflare's CDN never caches the .pmtiles.
        # It's read via HTTP range requests — a cached OLD file (or mixed old/new
        # byte ranges after a refresh) would corrupt reads. Serving it uncached
        # straight from R2 keeps every read consistent and makes refreshes instant,
        # with no cache-purge step (and no cache-purge API token) needed. The tiny
        # per-viewport range reads are cheap against R2. (Glyphs are static and can
        # stay cacheable — they aren't touched here.)
        run: |
          rclone copyto "/mnt/tiles/${PMTILES}" "R2:${R2_BUCKET}/${PMTILES}" \
            --s3-no-check-bucket --header-upload "Cache-Control: no-store" --stats-one-line
