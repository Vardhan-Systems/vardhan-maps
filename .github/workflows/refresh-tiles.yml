name: Refresh vector basemap tiles

# Rebuilds self-hosted basemap tile sets (one `.pmtiles` per state) from CURRENT
# OpenStreetMap data and uploads them to Cloudflare R2, independent of any package
# release. The scheduled run (no input) rebuilds the original Telangana + Andhra
# Pradesh set. `workflow_dispatch` builds specific states:
#   - `state`  — a single state, e.g. Karnataka → beyond-karnataka.pmtiles
#   - `states` — comma-separated states built IN PARALLEL (a matrix), or "all"
#                for every state/UT. Takes precedence over `state`.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   R2_ACCESS_KEY_ID       — R2 API token access key id
#   R2_SECRET_ACCESS_KEY   — R2 API token secret
#   R2_ACCOUNT_ID          — Cloudflare account id (for the R2 S3 endpoint)

on:
  schedule:
    - cron: "0 3 1 * *" # 03:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      state:
        description: "Single state to build (blank = Telangana + Andhra Pradesh default set). E.g. Karnataka"
        required: false
        default: ""
      states:
        description: "Comma-separated states to build in parallel (overrides 'state'); 'all' = every state/UT"
        required: false
        default: ""

concurrency:
  group: refresh-tiles
  cancel-in-progress: false

env:
  R2_BUCKET: beyond-basemap

jobs:
  # Turn the inputs into the list of states to build (one tile set each).
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        env:
          STATES: ${{ github.event.inputs.states }}
          STATE: ${{ github.event.inputs.state }}
        run: node scripts/states-matrix.mjs >> "$GITHUB_OUTPUT"

  build-and-upload:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false # one state's failure must not cancel the others
      max-parallel: 10
      matrix:
        state: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the large ephemeral disk (/mnt) for the build
        run: |
          sudo mkdir -p /mnt/tiles
          sudo chown "$USER" /mnt/tiles

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install osmium + rclone
        run: sudo apt-get update && sudo apt-get install -y osmium-tool rclone

      - name: Resolve target .pmtiles name
        run: |
          OUT=$(node scripts/state-tiles-meta.mjs "${{ matrix.state }}" | sed -n 's/^OUT=//p')
          echo "PMTILES=$OUT" >> "$GITHUB_ENV"
          echo "Will build and upload: $OUT"

      - name: Build tiles
        run: bash scripts/build-tiles.sh /mnt/tiles "${{ matrix.state }}"

      - name: Upload to R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        # Set Cache-Control: no-store so Cloudflare's CDN never caches the .pmtiles.
        # It's read via HTTP range requests — a cached OLD file (or mixed old/new
        # byte ranges after a refresh) would corrupt reads. Serving it uncached
        # straight from R2 keeps every read consistent and makes refreshes instant,
        # with no cache-purge step (and no cache-purge API token) needed. The tiny
        # per-viewport range reads are cheap against R2. (Glyphs are static and can
        # stay cacheable — they aren't touched here.)
        run: |
          rclone copyto "/mnt/tiles/${PMTILES}" "R2:${R2_BUCKET}/${PMTILES}" \
            --s3-no-check-bucket --header-upload "Cache-Control: no-store" --stats-one-line
